<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>River Ice Monitoring Dashboard</title>
  
 
  <!-- 1. GeoTIFF.js (Required by OpenLayers for COG decoding) -->
  <script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>

  <!-- 2. Proj4js (Required for Sentinel-2 UTM reprojections) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.15.0/proj4.js"></script>
  <!-- OpenLayers v10 CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.1.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@v10.1.0/dist/ol.js"></script>
  <!-- Register Proj4 with OpenLayers right after loading -->
  <script>
    if (window.proj4) {
      ol.proj.proj4.register(window.proj4);
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; }
    
    #sidebar {
      width: 320px;
      background: #1e293b;
      color: #f8fafc;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
      box-shadow: 2px 0 10px rgba(0,0,0,0.3);
    }

    h2 { font-size: 1.2rem; font-weight: 600; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-top: 8px; }

    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    
    .btn-secondary { background: #334155; }
    .btn-secondary:hover { background: #475569; }
    
    .btn-danger { background: #9f1239; }
    .btn-danger:hover { background: #881337; }

    #status-msg { font-size: 0.85rem; padding: 8px; border-radius: 4px; display: none; }
    .msg-error { background: rgba(225, 29, 72, 0.2); color: #fda4af; border: 1px solid #f43f5e; }
    .msg-info { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid #0284c7; }

    #map { flex: 1; height: 100%; background: #0f172a; }

    .legend-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .color-swatch {
      width: 16px;
      height: 16px;
      border: 2px solid #00b3b3;
      background: rgba(0, 179, 179, 0.25);
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>River Ice Monitor</h2>

    <div>
      <div style="margin-bottom: 12px;">
        <label for="aoi-select" style="font-size: 0.8rem; color: #94a3b8; display: block; margin-bottom: 4px;">Surveillance Area (AOI):</label>
        <select id="aoi-select" style="width: 100%; padding: 8px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px;">
          <option value="">-- Select AOI --</option>
        </select>
      </div>
      <div class="section-title">1. Imagery Acquisition</div>
      <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px;">Zoom into target river area and query latest Sentinel-2 scene.</p>
      <button id="get-imagery-btn">Get Imagery (Last 24h)</button>
      <div id="status-msg"></div>
      <div>
      <div class="section-title">Image Stretch Control</div>
      <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px;">
        <span>Max Reflectance</span>
        <span id="stretch-val">3000</span>
      </div>
        <input type="range" id="stretch-slider" min="1000" max="10000" step="250" value="3000" style="width: 100%; cursor: pointer;">
      </div>
    </div>

    <div>
      <div class="section-title">2. Ice Annotation Tool</div>
      <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px;">Draw polygons over river ice features.</p>
      <div class="legend-box" style="margin-bottom: 8px;">
        <div class="color-swatch"></div>
        <span>Desaturated Cyan Boundary</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <button id="draw-btn" class="btn-secondary">Draw Ice</button>
        <button id="clear-btn" class="btn-danger">Clear</button>
      </div>
    </div>

    <div style="margin-top: auto;">
      <div class="section-title">3. Products Export</div>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
        <button id="export-geojson-btn" class="btn-secondary">Export GeoJSON</button>
        <button id="export-png-btn" class="btn-secondary">Export Viewport (.PNG)</button>
      </div>
    </div>
  </div>

  <div id="map"></div>

  })
});

  stroke: new ol.style.Stroke({ color: '#00b3b3', width: 4 }),
  fill: new ol.style.Fill({ color: 'rgba(0, 179, 179, 0.25)' })
});

const vectorLayer = new ol.layer.Vector({
  source: vectorSource,
  style: vectorStyle
});

const map = new ol.Map({
  target: 'map',
  layers: [baseOsm, cogGroup, vectorLayer],

    center: ol.proj.fromLonLat([-100.0, 60.0]),

});

  statusMsg.style.display = 'none';

// --- READ AOI FEATURES & INITIALIZE MAP LAYER ---
const aoiFormat = new ol.format.GeoJSON();
const aoiFeatures = aoiFormat.readFeatures(AOI_GEOJSON, {
  dataProjection: 'EPSG:4326',
  featureProjection: 'EPSG:3857'
});

// Create reference footprint vector layer for AOI boundaries
const aoiLayer = new ol.layer.Vector({
  source: new ol.source.Vector({ features: aoiFeatures }),
  style: new ol.style.Style({
    stroke: new ol.style.Stroke({ color: '#f59e0b', width: 2, lineDash: [6, 6] }),
    fill: new ol.style.Fill({ color: 'rgba(245, 158, 11, 0.03)' })
  })
});

// --- POPULATE DROPDOWN & HANDLE NAVIGATION ---
const aoiSelect = document.getElementById('aoi-select');

// Dynamically populate options sorted alphabetically
const sortedFeatures = [...aoiFeatures].sort((a, b) => 
  a.get('Area_of_Interest').localeCompare(b.get('Area_of_Interest'))
);

sortedFeatures.forEach((feature) => {
  const name = feature.get('Area_of_Interest');
  const option = document.createElement('option');
  option.value = name;
  option.innerText = name;
  aoiSelect.appendChild(option);
});

// Zoom and pan to AOI centroid/extent on selection
aoiSelect.addEventListener('change', (e) => {
  const selectedName = e.target.value;
  if (!selectedName) return;

  const selectedFeature = aoiFeatures.find(f => f.get('Area_of_Interest') === selectedName);
  if (selectedFeature) {
    const geom = selectedFeature.getGeometry();
    const extent = geom.getExtent();

    // Smoothly animate map camera to fit selected AOI footprint
    map.getView().fit(extent, {
      duration: 1000,
      padding: [40, 40, 40, 40]
    });
  }
});

// --- PLANETARY COMPUTER SAS TOKEN SERVICE ---
let cachedSasToken = null;
let tokenExpiry = null;

async function getSasToken() {
  // Reuse token if cached and not expired
  if (cachedSasToken && tokenExpiry && new Date() < tokenExpiry) {
    return cachedSasToken;
  }

  const response = await fetch('https://planetarycomputer.microsoft.com/api/sas/v1/token/sentinel-2-l2a');
  if (!response.ok) throw new Error(`SAS token request failed: HTTP ${response.status}`);
  
  const data = await response.json();
  cachedSasToken = data.token;
  if (data['msft:expiry']) {
    tokenExpiry = new Date(data['msft:expiry']);
  }
  return cachedSasToken;
}

// --- STAC SEARCH & MULTI-SCENE FETCHING ---
getImageryBtn.addEventListener('click', async () => {
  hideStatus();
  getImageryBtn.disabled = true;
  getImageryBtn.innerText = 'Searching STAC...';

  try {
    // 1. Calculate & Clamp Bounding Box [-180, -90, 180, 90]
    const extent = map.getView().calculateExtent(map.getSize());
    const rawBbox = ol.proj.transformExtent(extent, map.getView().getProjection(), 'EPSG:4326');
    
    const bbox = [
      Math.max(-180, Math.min(180, rawBbox[0])),
      Math.max(-90, Math.min(90, rawBbox[1])),
      Math.max(-180, Math.min(180, rawBbox[2])),
      Math.max(-90, Math.min(90, rawBbox[3]))
    ];

    // 2. Timestamps (48h Window)
    const now = new Date();
    const past = new Date(now.getTime() - 48 * 60 * 60 * 1000);
    const formatIso = (date) => date.toISOString().split('.')[0] + 'Z';
    const datetime = `${formatIso(past)}/${formatIso(now)}`;

    // 3. Query STAC for up to 10 matching tiles
    const stacQuery = {
      collections: ['sentinel-2-l2a'],
      bbox: bbox,
      datetime: datetime,
      limit: 10,
      sortby: [
        {
          field: "properties.datetime",
          direction: "desc"
        }
      ]
    };

    const res = await fetch('https://planetarycomputer.microsoft.com/api/stac/v1/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(stacQuery)
    });

    if (!res.ok) throw new Error(`STAC search failed: HTTP ${res.status}`);

    const stacData = await res.json();

    if (!stacData.features || stacData.features.length === 0) {
      showStatus('No imagery acquired in the search window (48h).', 'error');
      return;
    }

    showStatus(`Found ${stacData.features.length} scene(s). Fetching token & loading...`, 'info');

    // 4. Retrieve single Collection Token (1 request total)
    const sasToken = await getSasToken();

    // 5. Clear existing satellite layers
    cogGroup.getLayers().clear();

    // --- LAYER CREATION INSIDE getImageryBtn HANDLER ---
const currentStretch = Number(stretchSlider.value);

const layers = stacData.features.map((item) => {
  const b12 = item.assets['B12']?.href;
  const b8a = item.assets['B8A']?.href;
  const b04 = item.assets['B04']?.href;

  if (!b12 || !b8a || !b04) return null;

  const signedB12 = `${b12}?${sasToken}`;
  const signedB8A = `${b8a}?${sasToken}`;
  const signedB04 = `${b04}?${sasToken}`;

  const cogSource = new ol.source.GeoTIFF({
    sources: [
      { url: signedB12 },
      { url: signedB8A },
      { url: signedB04 }
    ],
    normalize: false,
    loadMissingProjection: true
  });

  return new ol.layer.WebGLTile({
    source: cogSource,
    style: {
      variables: {
        maxReflectance: currentStretch
      },
      color: [
        'array',
        ['/', ['band', 1], ['var', 'maxReflectance']], // Red = B12
        ['/', ['band', 2], ['var', 'maxReflectance']], // Green = B8A
        ['/', ['band', 3], ['var', 'maxReflectance']], // Blue = B04
        
        ['case',
          ['all',
            ['>', ['band', 1], 0],
            ['>', ['band', 2], 0],
            ['>', ['band', 3], 0]
          ],
          1,
          0
        ]
      ]
    }
  });
}).filter(Boolean);

    if (layers.length === 0) {
      showStatus('No scenes with required bands were found.', 'error');
      return;
    }

    // 7. Add all resolved layers to map
    layers.forEach(layer => cogGroup.getLayers().push(layer));

    showStatus(`Successfully loaded ${layers.length} scene(s) into view.`, 'info');

  } catch (err) {
    console.error(err);
    showStatus(`Error: ${err.message}`, 'error');
  } finally {
    getImageryBtn.disabled = false;
    getImageryBtn.innerText = 'Get Imagery';
  }
});

// --- ANNOTATION DRAWING TOOL ---
drawBtn.addEventListener('click', () => {
  if (drawInteraction) {
    map.removeInteraction(drawInteraction);
    drawInteraction = null;
    drawBtn.innerText = 'Draw Ice';
    drawBtn.classList.replace('btn-primary', 'btn-secondary');
    return;
  }

  drawInteraction = new ol.interaction.Draw({
    source: vectorSource,
    type: 'Polygon'
  });

  map.addInteraction(drawInteraction);
  drawBtn.innerText = 'Stop Drawing';
  drawBtn.classList.replace('btn-secondary', 'btn-primary');
});

clearBtn.addEventListener('click', () => {
  vectorSource.clear();
});

// --- EXPORT FUNCTION 1: GEOJSON ---
exportGeoJsonBtn.addEventListener('click', () => {
  if (vectorSource.getFeatures().length === 0) {
    alert('No ice boundary annotations to export!');
    return;
  }
  const writer = new ol.format.GeoJSON();
  const geojsonStr = writer.writeFeatures(vectorSource.getFeatures(), {
    featureProjection: map.getView().getProjection(),
    dataProjection: 'EPSG:4326'
  });

  const blob = new Blob([geojsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `river_ice_annotation_${new Date().toISOString().slice(0, 10)}.geojson`;
  a.click();
  URL.revokeObjectURL(url);
});

// --- EXPORT FUNCTION 2: VIEWPORT PNG ---
exportPngBtn.addEventListener('click', () => {
  map.once('rendercomplete', () => {
    const mapCanvas = document.createElement('canvas');
    const size = map.getSize();
    mapCanvas.width = size[0];
    mapCanvas.height = size[1];
    const mapContext = mapCanvas.getContext('2d');

    Array.prototype.forEach.call(
      document.querySelectorAll('.ol-viewport canvas'),
      (canvas) => {
        if (canvas.width > 0) {
          const opacity = canvas.parentNode.style.opacity;
          mapContext.globalAlpha = opacity === '' ? 1 : Number(opacity);
          mapContext.drawImage(canvas, 0, 0);
        }
      }
    );

    const link = document.createElement('a');
    link.download = `river_ice_viewport_${new Date().toISOString().slice(0, 10)}.png`;
    link.href = mapCanvas.toDataURL('image/png');
    link.click();
  });
  map.renderSync();
}); 
  </script>
